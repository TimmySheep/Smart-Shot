name: SmartShot
options:
  bundleIdPrefix: com.timmysh34.smartshot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JY5U4D6JD3
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES

targets:
  SmartShotCore:
    type: framework
    platform: macOS
    sources:
      - path: SmartShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmysh34.smartshot.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  SmartShot:
    type: application
    platform: macOS
    sources:
      - path: SmartShot
    dependencies:
      - target: SmartShotCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmysh34.smartshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Smart Shot
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 TimmySheep"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SELECTED_FILE: READWRITE

  smartshot-replay:
    type: tool
    platform: macOS
    sources:
      - path: tools/smartshot-replay
    dependencies:
      - target: SmartShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmysh34.smartshot.replay

  SmartShotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SmartShotCoreTests
        excludes:
          - "Info.plist"
    dependencies:
      - target: SmartShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmysh34.smartshot.coretests
        INFOPLIST_FILE: SmartShotCoreTests/Info.plist

schemes:
  SmartShot:
    build:
      targets:
        SmartShot: all
    run:
      config: Debug
    archive:
      config: Release
  SmartShotCore-Test:
    build:
      targets:
        SmartShotCore: all
        SmartShotCoreTests: all
    test:
      config: Debug
      targets:
        - SmartShotCoreTests
